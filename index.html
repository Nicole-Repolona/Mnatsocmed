<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instagram • Messages</title>
  <!-- Official Supabase JS SDK (v2) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #000; color: #f5f5f5; display: flex; height: 100vh; width: 100vw; overflow: hidden; }

    /* AUTH SCREEN */
    #auth-screen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      width: 100%; height: 100%; background-color: #000;
    }
    .auth-card {
      background: #000; border: 1px solid #262626; border-radius: 8px; width: 350px; padding: 30px 20px;
      display: flex; flex-direction: column; align-items: center; text-align: center;
    }
    .insta-logo { font-family: 'Grand Hotel', cursive, sans-serif; font-size: 38px; margin-bottom: 30px; font-weight: normal; }
    .auth-input {
      width: 100%; background: #121212; border: 1px solid #262626; border-radius: 4px;
      padding: 10px; color: #fff; margin-bottom: 8px; font-size: 13px; outline: none;
    }
    .auth-input:focus { border-color: #555; }
    .auth-btn {
      width: 100%; background: #0095f6; border: none; border-radius: 8px; color: #fff;
      padding: 8px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px;
    }
    .auth-btn:hover { background: #1877f2; }
    .toggle-text { font-size: 13px; margin-top: 20px; color: #a8a8a8; cursor: pointer; }

    /* MAIN APP CONTAINER */
    #app-screen { display: none; width: 100%; height: 100%; flex-direction: row; }

    /* LEFT NAVIGATION SIDEBAR */
    .sidebar {
      width: 80px; border-right: 1px solid #262626; display: flex; flex-direction: column;
      align-items: center; padding: 20px 0; justify-content: space-between;
    }
    .nav-icons { display: flex; flex-direction: column; gap: 30px; align-items: center; }
    .nav-icon { cursor: pointer; fill: #f5f5f5; width: 24px; height: 24px; opacity: 0.7; }
    .nav-icon.active { opacity: 1; }
    .nav-icon:hover { opacity: 1; }

    /* CONVERSATION LIST (INBOX) */
    .inbox-panel {
      width: 350px; border-right: 1px solid #262626; display: flex; flex-direction: column;
    }
    .inbox-header {
      padding: 20px; font-size: 20px; font-weight: 700; border-bottom: 1px solid #262626;
      display: flex; justify-content: space-between; align-items: center;
    }
    .chat-item {
      display: flex; align-items: center; padding: 12px 20px; cursor: pointer;
      border-bottom: 1px solid #121212; background-color: #0d0d0d;
    }
    .avatar {
      width: 48px; height: 48px; border-radius: 50%; background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px; font-size: 18px; color: #fff;
    }
    .chat-info { display: flex; flex-direction: column; }
    .username { font-size: 14px; font-weight: 600; }
    .preview { font-size: 12px; color: #a8a8a8; margin-top: 2px; }

    /* MAIN CHAT WINDOW */
    .chat-panel { flex-grow: 1; display: flex; flex-direction: column; background: #000; }
    .chat-topbar {
      height: 60px; border-bottom: 1px solid #262626; display: flex; align-items: center;
      padding: 0 20px; font-size: 16px; font-weight: 600;
    }
    .messages-area {
      flex-grow: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
    }
    
    /* BUBBLE STYLES */
    .bubble-wrapper { display: flex; flex-direction: column; max-width: 65%; }
    .bubble-wrapper.sent { align-self: flex-end; align-items: flex-end; }
    .bubble-wrapper.received { align-self: flex-start; align-items: flex-start; }
    
    .sender-tag { font-size: 10px; color: #a8a8a8; margin-bottom: 3px; padding: 0 4px; }
    
    .bubble {
      padding: 10px 16px; border-radius: 22px; font-size: 14px; line-height: 1.4; word-break: break-word;
    }
    .sent .bubble { background-color: #3797f0; color: #fff; }
    .received .bubble { background-color: #262626; color: #fff; }

    /* INPUT BAR */
    .chat-input-row {
      padding: 15px 20px; display: flex; align-items: center; border-top: 1px solid #121212;
    }
    .message-field {
      width: 100%; background: #121212; border: 1px solid #262626; border-radius: 22px;
      padding: 12px 20px; color: #fff; font-size: 14px; outline: none;
    }
    .send-btn {
      background: none; border: none; color: #0095f6; font-weight: 600;
      font-size: 14px; margin-left: 12px; cursor: pointer;
    }
    .send-btn:hover { color: #fff; }
  </style>
</head>
<body>

  <!-- 1. SIGN IN / SIGN UP PAGE -->
  <div id="auth-screen">
    <div class="auth-card">
      <h1 class="insta-logo">Instagram</h1>
      <input type="email" id="email" class="auth-input" placeholder="Email address" />
      <input type="password" id="password" class="auth-input" placeholder="Password" />
      <button class="auth-btn" id="main-auth-btn" onclick="handleAuth()">Log In</button>
      <div class="toggle-text" id="toggle-auth" onclick="toggleAuthMode()">Don't have an account? Sign up</div>
    </div>
  </div>

  <!-- 2. INSTAGRAM DIRECT MAIN APP -->
  <div id="app-screen">
    <!-- Navigation Bar -->
    <div class="sidebar">
      <div class="nav-icons">
        <svg class="nav-icon active" viewBox="0 0 24 24"><path d="M12.003 2.001a9.998 9.998 0 0 0-7.07 17.072l-1.92 3.84a1 1 0 0 0 1.342 1.342l3.84-1.92a9.998 9.998 0 1 0 3.808-20.334zm0 18a7.95 7.95 0 0 1-4.048-1.102.998.998 0 0 0-.825-.088l-2.023 1.011 1.011-2.023a1 1 0 0 0-.088-.825A7.999 7.999 0 1 1 12.003 20z"/></svg>
      </div>
      <div class="nav-icon" title="Log Out" onclick="signOut()">
        <svg viewBox="0 0 24 24"><path d="M16 13v-2H7V8l-5 4 5 4v-3zM20 3h-9c-1.103 0-2 .897-2 2v4h2V5h9v14h-9v-4H9v4c0 1.103.897 2 2 2h9c1.103 0 2-.897 2-2V5c0-1.103-.897-2-2-2z"/></svg>
      </div>
    </div>

    <!-- Inbox List -->
    <div class="inbox-panel">
      <div class="inbox-header">
        <span id="header-user">Direct</span>
      </div>
      <div class="chat-item">
        <div class="avatar" id="avatar-icon">I</div>
        <div class="chat-info">
          <div class="username">Main Group Chat</div>
          <div class="preview">Global Friend Room</div>
        </div>
      </div>
    </div>

    <!-- Active Chat Panel -->
    <div class="chat-panel">
      <div class="chat-topbar">
        <span>Main Group Chat</span>
      </div>
      
      <div class="messages-area" id="messages"></div>

      <div class="chat-input-row">
        <input type="text" id="message-input" class="message-field" placeholder="Message..." onkeypress="if(event.key==='Enter') sendMessage()" />
        <button class="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    // YOUR SUPABASE CONFIGURATION
    const SUPABASE_URL = "https://tkdtnqarneklbnydsfiz.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_JstmL_vJ4cphAJyQURGcqw_cH3R4D1y";

    // Initialize Supabase Client
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let currentUser = null;
    let isSignUp = false;

    // Check existing session
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) loginSuccess(session.user);
    });

    function toggleAuthMode() {
      isSignUp = !isSignUp;
      document.getElementById("main-auth-btn").innerText = isSignUp ? "Sign Up" : "Log In";
      document.getElementById("toggle-auth").innerText = isSignUp ? "Have an account? Log in" : "Don't have an account? Sign up";
    }

    async function handleAuth() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (!email || !password) return alert("Please enter both email and password.");

      if (isSignUp) {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) alert(error.message);
        else alert("Sign up successful! You can now log in.");
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) alert(error.message);
        else loginSuccess(data.user);
      }
    }

    async function signOut() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    function loginSuccess(user) {
      currentUser = user;
      document.getElementById("auth-screen").style.display = "none";
      document.getElementById("app-screen").style.display = "flex";
      
      const handle = user.email.split('@')[0];
      document.getElementById("header-user").innerText = handle;
      document.getElementById("avatar-icon").innerText = handle.charAt(0).toUpperCase();

      loadMessages();
      subscribeRealtime();
    }

    async function loadMessages() {
      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .order('created_at', { ascending: true });

      if (!error && data) {
        const container = document.getElementById("messages");
        container.innerHTML = "";
        data.forEach(renderMessage);
        container.scrollTop = container.scrollHeight;
      }
    }

    async function sendMessage() {
      const input = document.getElementById("message-input");
      const text = input.value.trim();
      if (!text) return;

      input.value = "";
      await supabaseClient.from('messages').insert([{ 
        user_email: currentUser.email, 
        content: text 
      }]);
    }

    function renderMessage(msg) {
      const container = document.getElementById("messages");
      const isMe = msg.user_email === currentUser.email;
      const senderHandle = msg.user_email.split('@')[0];

      const wrapper = document.createElement("div");
      wrapper.className = `bubble-wrapper ${isMe ? 'sent' : 'received'}`;
      
      wrapper.innerHTML = `
        <span class="sender-tag">${senderHandle}</span>
        <div class="bubble">${escapeHtml(msg.content)}</div>
      `;

      container.appendChild(wrapper);
      container.scrollTop = container.scrollHeight;
    }

    function subscribeRealtime() {
      supabaseClient
        .channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          renderMessage(payload.new);
        })
        .subscribe();
    }

    function escapeHtml(text) {
      return text.replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }
  </script>
</body>
</html>
